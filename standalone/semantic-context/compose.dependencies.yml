services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: semantic_context
      POSTGRES_USER: semantic_context
      POSTGRES_PASSWORD: ${SCM_DB_PASSWORD:?Set SCM_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - semantic-context-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  semantic-context-db:
